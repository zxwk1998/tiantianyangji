name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 项目站点部署在 https://zxwk1998.github.io/tiantianyangji/，base 需指向仓库名
        run: npm run build -- --base=/tiantianyangji/

      - name: Copy APK to dist
        run: cp tiantianyangji.apk dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 自动启用 GitHub Pages（无需手动在仓库 Settings 里开启）
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag-apk:
    # 每次 push 中 tiantianyangji.apk 发生变化时，自动打递增版本 tag（vX.Y.Z），方便用户下载
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check APK changed
        id: check
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx 'tiantianyangji.apk'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag
        if: steps.check.outputs.changed == 'true'
        run: |
          NEW_TAG=$(node -e '
            const { execSync } = require("child_process");
            const tags = execSync("git tag --list \"v*\"", { encoding: "utf8" }).trim().split("\n").filter(Boolean);
            let max = [0, 0, 0];
            let found = false;
            for (const t of tags) {
              const m = t.match(/^v(\d+)\.(\d+)\.(\d+)$/);
              if (m) {
                found = true;
                const v = [Number(m[1]), Number(m[2]), Number(m[3])];
                if (v[0] > max[0] || (v[0] === max[0] && v[1] > max[1]) || (v[0] === max[0] && v[1] === max[1] && v[2] > max[2])) max = v;
              }
            }
            if (!found) max = [1, 0, 0];
            else max[2] += 1;
            console.log("v" + max.join("."));
          ')
          echo "创建版本标签: $NEW_TAG"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
